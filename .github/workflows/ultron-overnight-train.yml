name: ULTRON 16H Founder Training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultron-overnight-train.yml"
  workflow_dispatch:

concurrency:
  group: ultron-16h-training
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train-1:
    name: Training stage 1 (0-5h20m)
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build ULTRON
        shell: pwsh
        run: |
          cmake --build build --parallel 4

      - name: Run self-test
        shell: pwsh
        run: |
          & .\build\ultron.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "ULTRON self-test failed. Training will not start."
          }

      - name: Download UltraChat training data
        shell: pwsh
        run: |
          .\scripts\download_ultrachat.ps1 -TrainConversations 3000 -ValidationConversations 500

      - name: Train for 320 minutes from scratch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = ".\build\ultron.exe"
          $checkpoint = "models\ultron_big.bin"
          New-Item -ItemType Directory -Force -Path "models" | Out-Null

          $deadline = (Get-Date).AddMinutes(320)
          $epoch = 0
          $first = $true

          while ((Get-Date) -lt $deadline) {
            $epoch++
            Write-Host ""
            Write-Host "============================================================"
            Write-Host " ULTRON STAGE 1 - EPOCH $epoch"
            Write-Host "============================================================"

            $arguments = @(
              "--train", "data\external\ultrachat_train_sft.txt",
              "--epochs", "1",
              "--lr", "0.001",
              "--save", $checkpoint,
              "--save-every", "1",
              "--speed", "3",
              "--non-interactive"
            )

            if (!$first) {
              $arguments += @("--load", $checkpoint)
            }

            & $exe @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Stage 1 epoch $epoch failed with exit code $LASTEXITCODE."
            }

            if (!(Test-Path $checkpoint)) {
              throw "Stage 1 epoch $epoch completed without a checkpoint."
            }

            $first = $false
          }

          Write-Host "Stage 1 complete. Checkpoint exists at $checkpoint."

      - name: Upload stage 1 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-stage-1-checkpoint
          path: models/ultron_big.bin
          if-no-files-found: error
          retention-days: 2

  train-2:
    name: Training stage 2 (5h20m-10h40m)
    needs: train-1
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build ULTRON
        shell: pwsh
        run: |
          cmake --build build --parallel 4

      - name: Download stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ultron-stage-1-checkpoint
          path: models

      - name: Run self-test
        shell: pwsh
        run: |
          & .\build\ultron.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "ULTRON self-test failed before stage 2."
          }

      - name: Download UltraChat training data
        shell: pwsh
        run: |
          .\scripts\download_ultrachat.ps1 -TrainConversations 3000 -ValidationConversations 500

      - name: Continue training for 320 minutes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = ".\build\ultron.exe"
          $checkpoint = "models\ultron_big.bin"
          $deadline = (Get-Date).AddMinutes(320)
          $epoch = 0

          while ((Get-Date) -lt $deadline) {
            $epoch++
            Write-Host ""
            Write-Host "============================================================"
            Write-Host " ULTRON STAGE 2 - EPOCH $epoch"
            Write-Host "============================================================"

            & $exe --load $checkpoint --train data\external\ultrachat_train_sft.txt --epochs 1 --lr 0.001 --save $checkpoint --save-every 1 --speed 3 --non-interactive

            if ($LASTEXITCODE -ne 0) {
              throw "Stage 2 epoch $epoch failed with exit code $LASTEXITCODE."
            }

            if (!(Test-Path $checkpoint)) {
              throw "Stage 2 epoch $epoch completed without a checkpoint."
            }
          }

          Write-Host "Stage 2 complete. Checkpoint exists at $checkpoint."

      - name: Upload stage 2 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-stage-2-checkpoint
          path: models/ultron_big.bin
          if-no-files-found: error
          retention-days: 2

  train-3:
    name: Training stage 3 (10h40m-16h)
    needs: train-2
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build ULTRON
        shell: pwsh
        run: |
          cmake --build build --parallel 4

      - name: Download stage 2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ultron-stage-2-checkpoint
          path: models

      - name: Run self-test
        shell: pwsh
        run: |
          & .\build\ultron.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "ULTRON self-test failed before stage 3."
          }

      - name: Download UltraChat training data
        shell: pwsh
        run: |
          .\scripts\download_ultrachat.ps1 -TrainConversations 3000 -ValidationConversations 500

      - name: Continue training for 320 minutes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = ".\build\ultron.exe"
          $checkpoint = "models\ultron_big.bin"
          $deadline = (Get-Date).AddMinutes(320)
          $epoch = 0

          while ((Get-Date) -lt $deadline) {
            $epoch++
            Write-Host ""
            Write-Host "============================================================"
            Write-Host " ULTRON STAGE 3 - EPOCH $epoch"
            Write-Host "============================================================"

            & $exe --load $checkpoint --train data\external\ultrachat_train_sft.txt --epochs 1 --lr 0.001 --save $checkpoint --save-every 1 --speed 3 --non-interactive

            if ($LASTEXITCODE -ne 0) {
              throw "Stage 3 epoch $epoch failed with exit code $LASTEXITCODE."
            }

            if (!(Test-Path $checkpoint)) {
              throw "Stage 3 epoch $epoch completed without a checkpoint."
            }
          }

          Write-Host "Stage 3 complete. Final checkpoint exists at $checkpoint."

      - name: Final validation
        shell: pwsh
        run: |
          & .\build\ultron.exe --load models\ultron_big.bin --eval data\external\ultrachat_test_sft.txt --no-online-learning --non-interactive
          if ($LASTEXITCODE -ne 0) {
            throw "Final held-out validation failed."
          }

      - name: Upload final ULTRON checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-16H-FINAL
          path: |
            models/ultron_big.bin
            data/external/ultrachat_manifest.txt
          if-no-files-found: error
          retention-days: 30
